services:
  ihk-api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ihk-pruefungsuebersicht-api
    ports:
      - "12001:3001"
    environment:
      # Admin token MUST be provided via Portainer/env (never committed).
      ADMIN_TOKEN: ${ADMIN_TOKEN:?ADMIN_TOKEN must be set in the environment}
      GOOGLE_SHEET_ID: ${GOOGLE_SHEET_ID:-1jDFsBoQyzReOv-AxFAgrhAZkdimwp-oj7UT56pqf0Wk}
      IMPORT_INTERVAL_HOURS: ${IMPORT_INTERVAL_HOURS:-6}
      IMPORT_REQUEST_DELAY_MS: ${IMPORT_REQUEST_DELAY_MS:-400}
      PORT: "3001"
      DATABASE_URL: "file:/app/data/ihk.db"
    volumes:
      - ihk-data:/app/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:3001/api/health"]
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3

volumes:
  ihk-data:
